[package]
name = "store-os-desktop"
version = "5.2.1"
description = "3C Store OS — Tauri 2 Desktop Shell + 3C Edge Node Standard Sidecar"
authors = ["3C Corp Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
